<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SSC CGL Prep Dossier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-deep:#0A0A12;
    --navy-panel:#15151F;
    --accent:#7C6CF0;
    --accent-soft:#9C8CFF;
    --accent2:#A855F7;
    --cream:#E8E7ED;
    --cream-dim:#8B8A98;
    --done:#4FAE7E;
    --line: rgba(156,140,255,0.14);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(900px 700px at 50% 30%, rgba(124,108,240,0.20) 0%, transparent 60%),
      radial-gradient(1200px 600px at 10% -10%, rgba(168,85,247,0.10) 0%, transparent 60%),
      var(--navy-deep);
    color:var(--cream);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    padding:28px 16px 70px;
    position:relative;
    overflow-x:hidden;
  }
  .wrap{max-width:760px;margin:0 auto;position:relative;z-index:1;}
  .particle-field{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:0;
  }
  .particle{
    position:absolute;
    border-radius:50%;
    background:#ffffff;
    opacity:0;
  }
  @keyframes twinkle{
    0%, 100%{ opacity:0; }
    50%{ opacity:var(--max-op, 0.5); }
  }
  @keyframes drift{
    from{ transform:translate(0,0); }
    to{ transform:translate(var(--dx,20px), var(--dy,20px)); }
  }

  .dossier-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    border-bottom:1px solid var(--line);
    padding-bottom:20px;
    margin-bottom:26px;
    gap:16px;
    flex-wrap:wrap;
  }
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:3px;
    color:var(--accent);
    text-transform:uppercase;
    margin-bottom:8px;
  }
  h1{
    font-family:'Playfair Display', serif;
    font-weight:900;
    font-size:34px;
    margin:0;
    color:var(--cream);
    letter-spacing:0.3px;
  }
  h1 em{
    font-style:normal;
    color:var(--accent-soft);
  }
  .rename-btn{
    background:none;
    border:none;
    color:var(--cream-dim);
    font-size:14px;
    cursor:pointer;
    vertical-align:middle;
    margin-left:6px;
    opacity:0.55;
    transition:opacity .2s ease, color .2s ease, transform .2s ease;
  }
  .rename-btn:hover{
    opacity:1;
    color:var(--accent-soft);
    transform:scale(1.15);
  }

  .dial-box{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
  }
  .dial{
    width:88px;height:88px;
    position:relative;
  }
  .dial svg{transform:rotate(-90deg);width:100%;height:100%;}
  .dial-track{fill:none;stroke:rgba(255,255,255,0.08);stroke-width:8;}
  .dial-fill{fill:none;stroke:url(#dialGrad);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.4,0,.2,1);}
  .dial-num{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    font-family:'JetBrains Mono', monospace;
    font-size:18px;font-weight:700;
    color:var(--accent-soft);
  }
  .dial-label{
    font-family:'JetBrains Mono', monospace;
    font-size:9px;letter-spacing:2px;color:var(--cream-dim);
    text-transform:uppercase;
  }

  .tabs{
    display:flex;
    gap:8px;
    background:var(--navy-panel);
    border:1px solid var(--line);
    border-radius:16px;
    padding:6px;
    margin-bottom:24px;
    perspective:600px;
  }
  .tab{
    flex:1;
    text-align:center;
    padding:13px 12px;
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:13.5px;
    color:var(--cream-dim);
    border-radius:11px;
    cursor:pointer;
    position:relative;
    transform-style:preserve-3d;
    transition:transform .35s cubic-bezier(.22,1,.36,1), box-shadow .35s cubic-bezier(.22,1,.36,1), color .25s ease, background .25s ease;
    box-shadow:0 1px 0 rgba(255,255,255,0.03) inset, 0 6px 14px rgba(0,0,0,0);
    overflow:hidden;
  }
  .tab::before{
    content:'';
    position:absolute;
    inset:0;
    background:linear-gradient(120deg, transparent 20%, rgba(255,255,255,0.35) 45%, transparent 70%);
    transform:translateX(-120%);
    transition:transform .6s ease;
    pointer-events:none;
  }
  .tab:hover::before{transform:translateX(120%);}
  .tab:hover{
    color:var(--accent-soft);
    transform:translateY(-2px) rotateX(var(--tiltX, 4deg)) rotateY(var(--tiltY, 0deg));
    box-shadow:0 10px 18px -10px rgba(0,0,0,0.5);
  }
  .tab.active{
    background:linear-gradient(135deg, #6D6BF7 0%, #A855F7 100%);
    color:#ffffff;
    box-shadow:0 8px 20px -6px rgba(124,108,240,0.55);
    transform:translateY(-1px) rotateX(2deg);
  }
  .tab.active:hover{
    transform:translateY(-3px) rotateX(var(--tiltX, 4deg)) rotateY(var(--tiltY, 0deg));
    box-shadow:0 12px 26px -6px rgba(124,108,240,0.65);
  }
  .tab:active{transform:translateY(0px) rotateX(0deg) rotateY(0deg) scale(0.98);}
  .tab .tab-count{
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    opacity:0.75;
    margin-left:5px;
  }

  .subject-strip{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:22px;
  }
  .strip-bar-shell{
    flex:1;
    height:6px;
    background:rgba(255,255,255,0.07);
    border-radius:6px;
    overflow:hidden;
    margin:0 14px;
  }
  .strip-bar-fill{
    height:100%;
    background:linear-gradient(90deg,#6D6BF7, #A855F7);
    width:0%;
    transition:width .5s cubic-bezier(.4,0,.2,1);
  }
  .strip-label{
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    color:var(--cream-dim);
    white-space:nowrap;
  }

  .phase{
    margin-bottom:22px;
    background:linear-gradient(180deg, rgba(255,255,255,0.025), rgba(255,255,255,0));
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
  }
  .phase-head{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 16px;
    cursor:pointer;
    user-select:none;
  }
  .phase-numeral{
    font-family:'Playfair Display', serif;
    font-weight:700;
    font-size:20px;
    color:var(--accent);
    width:34px;
    text-align:center;
    flex:none;
  }
  .phase-title{
    font-weight:600;
    font-size:15px;
    flex:1;
    color:var(--cream);
  }
  .phase-tally{
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    color:var(--cream-dim);
    flex:none;
  }
  .chevron{
    width:9px;height:9px;
    border-right:2px solid var(--accent-soft);
    border-bottom:2px solid var(--accent-soft);
    transform:rotate(45deg);
    transition:transform .25s ease;
    flex:none;
    margin-right:2px;
  }
  .phase.collapsed .chevron{transform:rotate(-45deg);}
  .phase-body{
    max-height:1000px;
    overflow:hidden;
    transition:max-height .35s ease;
    border-top:1px solid var(--line);
  }
  .phase.collapsed .phase-body{max-height:0;border-top:none;}

  .topic{
    display:flex;
    align-items:center;
    gap:13px;
    padding:12px 16px;
    border-bottom:1px solid var(--line);
    cursor:pointer;
    transition:background .15s ease;
  }
  .topic:last-child{border-bottom:none;}
  .topic:hover{background:rgba(255,255,255,0.02);}
  .serial{
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    color:var(--cream-dim);
    width:22px;
    flex:none;
  }
  .box{
    flex:none;
    width:22px;height:22px;
    border:2px solid var(--accent-soft);
    border-radius:7px;
    display:flex;align-items:center;justify-content:center;
    transition:all .2s ease;
  }
  .topic:hover .box{
    transform:scale(1.08);
    border-color:var(--accent-soft);
    background:rgba(156,140,255,0.1);
  }
  .box svg{
    width:12px;height:12px;
    opacity:0;
    transform:scale(0.5);
    transition:all .2s ease;
  }
  .topic.done .box{
    background:linear-gradient(135deg, #63c996, var(--done));
    border-color:var(--done);
    box-shadow:0 4px 12px -3px rgba(79,174,126,0.5);
  }
  .topic.done:hover .box{transform:scale(1.08);}
  .topic.done .box svg{opacity:1;transform:scale(1);}
  .topic-text{
    font-size:14.5px;
    line-height:1.4;
    color:var(--cream);
    flex:1;
  }
  .topic.done .topic-text{
    color:var(--cream-dim);
    text-decoration:line-through;
    text-decoration-color:rgba(154,161,181,0.5);
  }

  footer{
    margin-top:34px;
    text-align:center;
    perspective:500px;
  }
  .footer-actions{
    display:flex;
    gap:12px;
    justify-content:center;
    flex-wrap:wrap;
  }
  .share-btn{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:1px;
    color:#ffffff;
    background:linear-gradient(135deg, #6D6BF7 0%, #A855F7 100%);
    border:none;
    padding:10px 22px;
    border-radius:24px;
    cursor:pointer;
    text-transform:uppercase;
    position:relative;
    overflow:hidden;
    box-shadow:0 8px 18px -6px rgba(124,108,240,0.5);
    transition:transform .3s cubic-bezier(.22,1,.36,1), box-shadow .3s ease;
  }
  .share-btn::before{
    content:'';
    position:absolute;
    inset:0;
    background:linear-gradient(120deg, transparent 25%, rgba(255,255,255,0.35) 50%, transparent 75%);
    transform:translateX(-130%);
    transition:transform .6s ease;
  }
  .share-btn:hover::before{transform:translateX(130%);}
  .share-btn:hover{
    transform:translateY(-3px);
    box-shadow:0 12px 24px -6px rgba(124,108,240,0.65);
  }
  .share-btn:active{transform:translateY(0) scale(0.97);}

  .snapshot-banner{
    display:none;
    align-items:center;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
    background:linear-gradient(180deg, rgba(156,140,255,0.10), rgba(156,140,255,0.03));
    border:1px solid var(--line);
    border-radius:12px;
    padding:10px 16px;
    margin-bottom:22px;
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    color:var(--cream-dim);
    text-align:center;
  }
  .snapshot-icon{font-size:14px;}
  #exitSnapshotLink{
    color:var(--accent-soft);
    text-decoration:none;
    font-weight:700;
    border-bottom:1px solid rgba(156,140,255,0.4);
  }
  #exitSnapshotLink:hover{color:#fff;}

  body.snapshot-mode .topic{cursor:default;}
  body.snapshot-mode .topic:hover{background:none;transform:none;}
  body.snapshot-mode .topic:hover .box{transform:none;background:none;}

  .toast{
    position:fixed;
    bottom:26px;
    left:50%;
    transform:translateX(-50%) translateY(16px);
    background:var(--navy-panel);
    border:1px solid var(--line);
    color:var(--cream);
    padding:12px 22px;
    border-radius:12px;
    font-size:13px;
    font-family:'Inter', sans-serif;
    box-shadow:0 16px 34px -10px rgba(0,0,0,0.6);
    opacity:0;
    pointer-events:none;
    transition:opacity .3s ease, transform .3s ease;
    z-index:200;
    max-width:88%;
    text-align:center;
  }
  .toast.visible{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }
  .quote{
    font-family:'Playfair Display', serif;
    font-style:italic;
    font-size:14.5px;
    color:var(--accent-soft);
    margin-bottom:16px;
  }
  .reset-btn{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:1px;
    color:var(--cream-dim);
    background:linear-gradient(160deg, rgba(255,255,255,0.04), rgba(255,255,255,0));
    border:1px solid var(--line);
    padding:10px 22px;
    border-radius:24px;
    cursor:pointer;
    text-transform:uppercase;
    position:relative;
    overflow:hidden;
    transition:transform .3s cubic-bezier(.22,1,.36,1), box-shadow .3s cubic-bezier(.22,1,.36,1), border-color .25s ease, color .25s ease;
    box-shadow:0 1px 0 rgba(255,255,255,0.04) inset;
  }
  .reset-btn::before{
    content:'';
    position:absolute;
    inset:0;
    background:linear-gradient(120deg, transparent 25%, rgba(156,140,255,0.3) 50%, transparent 75%);
    transform:translateX(-130%);
    transition:transform .6s ease;
  }
  .reset-btn:hover::before{transform:translateX(130%);}
  .reset-btn:hover{
    border-color:var(--accent-soft);
    color:var(--accent-soft);
    transform:translateY(-3px) rotateX(var(--tiltX, 0deg)) rotateY(var(--tiltY, 0deg));
    box-shadow:0 12px 20px -8px rgba(124,108,240,0.4), 0 1px 0 rgba(255,255,255,0.06) inset;
  }
  .reset-btn:active{transform:translateY(0px) scale(0.97);}

  .phase-head{transition:background .25s ease;}
  .phase-head:hover{background:rgba(255,255,255,0.025);}
  .topic{transition:background .2s ease, transform .2s ease;}
  .topic:hover{transform:translateX(3px);}

  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(6,6,12,0.72);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:100;
    opacity:0;
    pointer-events:none;
    transition:opacity .3s ease;
  }
  .modal-overlay.visible{
    opacity:1;
    pointer-events:auto;
  }
  .modal-card{
    width:100%;
    max-width:360px;
    background:linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0)) , var(--navy-panel);
    border:1px solid var(--line);
    border-radius:18px;
    padding:30px 26px;
    text-align:center;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.6), 0 0 0 1px rgba(156,140,255,0.06);
    transform:translateY(14px) scale(0.97);
    transition:transform .35s cubic-bezier(.22,1,.36,1);
  }
  .modal-overlay.visible .modal-card{
    transform:translateY(0) scale(1);
  }
  .modal-eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    letter-spacing:3px;
    color:var(--accent);
    text-transform:uppercase;
    margin-bottom:10px;
  }
  .modal-title{
    font-family:'Playfair Display', serif;
    font-weight:700;
    font-size:22px;
    margin:0 0 20px;
    color:var(--cream);
  }
  .modal-title em{font-style:normal;color:var(--accent-soft);}
  .modal-sub{
    font-size:13px;
    color:var(--cream-dim);
    margin:0 0 20px;
    line-height:1.5;
  }
  .modal-input{
    width:100%;
    background:rgba(255,255,255,0.04);
    border:1px solid var(--line);
    border-radius:10px;
    padding:13px 14px;
    font-family:'Inter', sans-serif;
    font-size:15px;
    color:var(--cream);
    margin-bottom:16px;
    outline:none;
    transition:border-color .2s ease, background .2s ease;
  }
  .modal-input::placeholder{color:var(--cream-dim);opacity:0.6;}
  .modal-input:focus{
    border-color:var(--accent-soft);
    background:rgba(255,255,255,0.06);
  }
  .modal-btn{
    width:100%;
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:14px;
    color:#fff;
    background:linear-gradient(135deg, #6D6BF7 0%, #A855F7 100%);
    border:none;
    padding:13px 18px;
    border-radius:10px;
    cursor:pointer;
    box-shadow:0 10px 24px -8px rgba(124,108,240,0.55);
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .modal-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 14px 28px -8px rgba(124,108,240,0.65);
  }
  .modal-btn:active{transform:translateY(0) scale(0.98);}

  @media (max-width:480px){
    h1{font-size:26px;}
    .dial{width:72px;height:72px;}
  }
</style>
</head>
<body>
<div class="particle-field" id="particleField"></div>
<div class="wrap">

  <div class="dossier-head">
    <div>
      <div class="eyebrow">Mission Tracker · SSC CGL</div>
      <h1><span id="userName">Sunny's</span> Prep <em>Dossier</em><button class="rename-btn" id="renameBtn" title="Change name">&#9998;</button></h1>
    </div>
    <div class="dial-box">
      <div class="dial">
        <svg viewBox="0 0 100 100">
          <defs>
            <linearGradient id="dialGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#6D6BF7"/>
              <stop offset="100%" stop-color="#A855F7"/>
            </linearGradient>
          </defs>
          <circle class="dial-track" cx="50" cy="50" r="42"></circle>
          <circle class="dial-fill" id="dialFill" cx="50" cy="50" r="42" stroke-dasharray="264" stroke-dashoffset="264"></circle>
        </svg>
        <div class="dial-num" id="dialNum">0%</div>
      </div>
      <div class="dial-label">Overall</div>
    </div>
  </div>

  <div class="snapshot-banner" id="snapshotBanner">
    <span class="snapshot-icon">📸</span>
    <span id="snapshotText"></span>
    <a href="#" id="exitSnapshotLink">Start your own tracker →</a>
  </div>

  <div class="tabs">
    <div class="tab active" data-subject="maths">Maths <span class="tab-count" id="tabCountMaths"></span></div>
    <div class="tab" data-subject="reasoning">Reasoning <span class="tab-count" id="tabCountReasoning"></span></div>
  </div>

  <div class="subject-strip">
    <div class="strip-label" id="subjectLabel">MATHEMATICS</div>
    <div class="strip-bar-shell"><div class="strip-bar-fill" id="subjectFill"></div></div>
    <div class="strip-label" id="subjectCount">0/0</div>
  </div>

  <div id="phases"></div>

  <footer>
    <div class="quote">"Iss Baar Nahi, To Kabhi Nahi."</div>
    <div class="footer-actions">
      <button class="reset-btn" id="resetBtn">Reset This Subject</button>
      <button class="share-btn" id="shareBtn">Share My Progress</button>
    </div>
  </footer>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="nameModalOverlay">
  <div class="modal-card">
    <h2 class="modal-title">Enter Your <em>Name</em></h2>
    <input type="text" id="nameInput" class="modal-input" placeholder="Type your name here" maxlength="24" autocomplete="off" />
    <button class="modal-btn" id="nameSubmitBtn">Start My Tracker</button>
  </div>
</div>

<script>
const SUBJECTS = {
  maths: {
    label: "MATHEMATICS",
    storageKey: "ssc_cgl_maths_progress_v2",
    phases: [
      { title:"Foundation", topics:["Number System","Simplification (BODMAS) & Approximation","HCF & LCM","Percentage"] },
      { title:"Arithmetic Core", topics:["Ratio & Proportion","Average","Profit, Loss & Discount","Simple Interest & Compound Interest","Time & Work (+ Pipes & Cistern)","Time, Speed & Distance (+ Boats & Trains)","Mixture & Alligation","Partnership"] },
      { title:"Advance Maths", topics:["Algebra","Trigonometry","Geometry","Mensuration (2D & 3D)","Coordinate Geometry (basic)"] },
      { title:"Data & Stats", topics:["Data Interpretation","Data Sufficiency","Statistics (Mean, Median, Mode, SD)"] }
    ]
  },
  reasoning: {
    label: "REASONING",
    storageKey: "ssc_cgl_reasoning_progress_v2",
    phases: [
      { title:"Verbal Basics", topics:["Analogy","Classification (Odd One Out)","Series (Number, Alphabet, Mixed)","Coding-Decoding"] },
      { title:"Verbal Core", topics:["Blood Relation","Direction & Distance","Ranking & Order","Alphabet Test","Word Formation","Syllogism","Statement & Conclusion / Assumption"] },
      { title:"Non-Verbal", topics:["Mirror Image","Water Image","Paper Folding & Cutting","Figure Counting (Triangles, Lines etc.)","Embedded Figures","Series of Figures","Figure Completion"] },
      { title:"Puzzle & Analytical", topics:["Seating Arrangement (Linear & Circular)","Puzzle (Box, Floor, Age based)","Venn Diagram","Matrix & Word-Letter Coding","Non-Verbal Analogy & Classification"] },
      { title:"Misc", topics:["Calendar & Clock","Mathematical Operations","Missing Number in Figures","Dice & Cube"] }
    ]
  }
};

const ROMAN = ["I","II","III","IV","V","VI"];
const NAME_KEY = "ssc_cgl_user_name";
let currentSubject = "maths";
let isSnapshotMode = false;
let state = { maths: {}, reasoning: {} };
let collapsedPhases = { maths: {}, reasoning: {} };

function topicId(pIdx, tIdx){ return `p${pIdx}_t${tIdx}`; }

function countSubject(key){
  const subj = SUBJECTS[key];
  let total = 0, done = 0;
  subj.phases.forEach((phase, pIdx) => {
    phase.topics.forEach((t, tIdx) => {
      total++;
      if(state[key][topicId(pIdx,tIdx)]) done++;
    });
  });
  return { total, done };
}

function renderTabs(){
  const m = countSubject('maths');
  const r = countSubject('reasoning');
  document.getElementById('tabCountMaths').textContent = `${m.done}/${m.total}`;
  document.getElementById('tabCountReasoning').textContent = `${r.done}/${r.total}`;

  const overallTotal = m.total + r.total;
  const overallDone = m.done + r.done;
  const pct = overallTotal ? Math.round((overallDone/overallTotal)*100) : 0;
  const circumference = 264;
  const offset = circumference - (pct/100)*circumference;
  document.getElementById('dialFill').style.strokeDashoffset = offset;
  document.getElementById('dialNum').textContent = pct + '%';
}

function renderSubjectStrip(){
  const c = countSubject(currentSubject);
  document.getElementById('subjectLabel').textContent = SUBJECTS[currentSubject].label;
  document.getElementById('subjectCount').textContent = `${c.done}/${c.total}`;
  document.getElementById('subjectFill').style.width = c.total ? `${(c.done/c.total)*100}%` : '0%';
}

function renderPhases(){
  const container = document.getElementById('phases');
  container.innerHTML = '';
  const subj = SUBJECTS[currentSubject];

  subj.phases.forEach((phase, pIdx) => {
    let doneCount = 0;
    phase.topics.forEach((t, tIdx) => { if(state[currentSubject][topicId(pIdx,tIdx)]) doneCount++; });

    const isCollapsed = !!collapsedPhases[currentSubject][pIdx];
    const phaseDiv = document.createElement('div');
    phaseDiv.className = 'phase' + (isCollapsed ? ' collapsed' : '');

    const head = document.createElement('div');
    head.className = 'phase-head';
    head.innerHTML = `
      <div class="phase-numeral">${ROMAN[pIdx] || (pIdx+1)}</div>
      <div class="phase-title">${phase.title}</div>
      <div class="phase-tally">${doneCount}/${phase.topics.length}</div>
      <div class="chevron"></div>
    `;
    head.addEventListener('click', () => {
      collapsedPhases[currentSubject][pIdx] = !collapsedPhases[currentSubject][pIdx];
      renderPhases();
    });
    phaseDiv.appendChild(head);

    const body = document.createElement('div');
    body.className = 'phase-body';

    phase.topics.forEach((topic, tIdx) => {
      const id = topicId(pIdx, tIdx);
      const isDone = !!state[currentSubject][id];
      const row = document.createElement('div');
      row.className = 'topic' + (isDone ? ' done' : '');
      row.innerHTML = `
        <div class="serial">${String(tIdx+1).padStart(2,'0')}</div>
        <div class="box">
          <svg viewBox="0 0 24 24" fill="none" stroke="#0E1830" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
        <div class="topic-text">${topic}</div>
      `;
      row.addEventListener('click', () => toggle(id));
      body.appendChild(row);
    });

    phaseDiv.appendChild(body);
    container.appendChild(phaseDiv);
  });
}

function renderAll(){
  renderTabs();
  renderSubjectStrip();
  renderPhases();
}

function toggle(id){
  if(isSnapshotMode) return;
  state[currentSubject][id] = !state[currentSubject][id];
  renderAll();
  try{
    localStorage.setItem(SUBJECTS[currentSubject].storageKey, JSON.stringify(state[currentSubject]));
  }catch(e){ console.error('Save failed', e); }
}

function loadSubject(key){
  try{
    const raw = localStorage.getItem(SUBJECTS[key].storageKey);
    if(raw){
      state[key] = JSON.parse(raw);
    }
  }catch(e){
    state[key] = {};
  }
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentSubject = tab.dataset.subject;
    renderAll();
  });
});

document.getElementById('resetBtn').addEventListener('click', () => {
  state[currentSubject] = {};
  renderAll();
  try{
    localStorage.setItem(SUBJECTS[currentSubject].storageKey, JSON.stringify(state[currentSubject]));
  }catch(e){ console.error('Reset failed', e); }
});

function addTilt(el, strength = 10){
  el.addEventListener('mousemove', (e) => {
    const rect = el.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const cx = rect.width / 2;
    const cy = rect.height / 2;
    const rotateY = ((x - cx) / cx) * strength;
    const rotateX = -((y - cy) / cy) * strength;
    el.style.setProperty('--tiltX', rotateX.toFixed(2) + 'deg');
    el.style.setProperty('--tiltY', rotateY.toFixed(2) + 'deg');
  });
  el.addEventListener('mouseleave', () => {
    el.style.setProperty('--tiltX', '0deg');
    el.style.setProperty('--tiltY', '0deg');
  });
}

function encodeSnapshot(obj){
  try{
    const json = JSON.stringify(obj);
    return btoa(unescape(encodeURIComponent(json)));
  }catch(e){
    console.error('Encode failed', e);
    return null;
  }
}

function decodeSnapshot(str){
  try{
    const json = decodeURIComponent(escape(atob(str)));
    return JSON.parse(json);
  }catch(e){
    console.error('Decode failed', e);
    return null;
  }
}

function getSnapshotFromHash(){
  const hash = window.location.hash || '';
  const match = hash.match(/snap=([^&]+)/);
  if(!match) return null;
  return decodeSnapshot(decodeURIComponent(match[1]));
}

function formatSnapshotDate(ts){
  try{
    const d = new Date(ts);
    const datePart = d.toLocaleDateString('en-IN', { day:'numeric', month:'short' });
    const timePart = d.toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit' });
    return `${datePart}, ${timePart}`;
  }catch(e){ return ''; }
}

let toastTimer = null;
function showToast(msg){
  const toast = document.getElementById('toast');
  if(!toast) return;
  toast.textContent = msg;
  toast.classList.add('visible');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('visible'), 2600);
}

function copyToClipboard(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text)
      .then(() => showToast('Link Copied🎊'))
      .catch(() => fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try{
    document.execCommand('copy');
    showToast('Link Copied🎊');
  }catch(e){
    showToast('Copy failed');
  }
  document.body.removeChild(ta);
}

function shareProgress(){
  let name = 'Sunny';
  try{ name = localStorage.getItem(NAME_KEY) || 'Sunny'; }catch(e){}
  const snapshot = {
    name: name,
    maths: state.maths,
    reasoning: state.reasoning,
    ts: Date.now()
  };
  const encoded = encodeSnapshot(snapshot);
  if(!encoded){
    showToast('Kuch gadbad ho gayi, dobara try karo');
    return;
  }
  const url = `${window.location.origin}${window.location.pathname}#snap=${encoded}`;
  copyToClipboard(url);
}

function enterSnapshotMode(snap){
  isSnapshotMode = true;
  document.body.classList.add('snapshot-mode');
  state.maths = snap.maths || {};
  state.reasoning = snap.reasoning || {};
  renderAll();
  applyName(snap.name || 'Sunny');

  const banner = document.getElementById('snapshotBanner');
  const text = document.getElementById('snapshotText');
  text.textContent = `Snapshot of ${possessive(snap.name || 'Sunny')} progress · ${formatSnapshotDate(snap.ts)}`;
  banner.style.display = 'flex';

  document.getElementById('renameBtn').style.display = 'none';
  document.getElementById('resetBtn').style.display = 'none';
  document.getElementById('shareBtn').style.display = 'none';

  document.getElementById('exitSnapshotLink').addEventListener('click', (e) => {
    e.preventDefault();
    try{ localStorage.removeItem(NAME_KEY); }catch(err){ console.error('Could not clear name', err); }
    window.location.hash = '';
    window.location.reload();
  });
}

document.getElementById('shareBtn').addEventListener('click', shareProgress);

function possessive(name){
  const trimmed = (name || '').trim();
  if(!trimmed) return "Sunny's";
  return /s$/i.test(trimmed) ? trimmed + "'" : trimmed + "'s";
}

function applyName(name){
  document.getElementById('userName').textContent = possessive(name);
}

function showModal(prefill){
  const overlay = document.getElementById('nameModalOverlay');
  const input = document.getElementById('nameInput');
  input.value = prefill || '';
  overlay.classList.add('visible');
  setTimeout(() => input.focus(), 250);
}

function hideModal(){
  document.getElementById('nameModalOverlay').classList.remove('visible');
}

function submitName(){
  const input = document.getElementById('nameInput');
  const val = input.value.trim();
  const finalName = val || 'Sunny';
  try{
    localStorage.setItem(NAME_KEY, finalName);
  }catch(e){ console.error('Name save failed', e); }
  applyName(finalName);
  hideModal();
}

document.getElementById('nameSubmitBtn').addEventListener('click', submitName);
document.getElementById('nameInput').addEventListener('keydown', (e) => {
  if(e.key === 'Enter') submitName();
});
document.getElementById('renameBtn').addEventListener('click', () => {
  let existing = '';
  try{ existing = localStorage.getItem(NAME_KEY) || ''; }catch(e){}
  showModal(existing);
});

function initName(){
  let saved = '';
  try{ saved = localStorage.getItem(NAME_KEY); }catch(e){ saved = null; }
  if(saved){
    applyName(saved);
  } else {
    showModal();
  }
}

function initParticles(){
  const field = document.getElementById('particleField');
  if(!field) return;
  const COUNT = 45;
  for(let i=0;i<COUNT;i++){
    const dot = document.createElement('div');
    dot.className = 'particle';
    const size = (Math.random()*2.2 + 1.4).toFixed(1);
    const top = (Math.random()*100).toFixed(2);
    const left = (Math.random()*100).toFixed(2);
    const dx = (Math.random()*50 - 25).toFixed(0) + 'px';
    const dy = (Math.random()*50 - 25).toFixed(0) + 'px';
    const blinkDur = (Math.random()*5 + 4).toFixed(1) + 's';
    const driftDur = (Math.random()*22 + 18).toFixed(1) + 's';
    const delay = (Math.random()*6).toFixed(1) + 's';
    const maxOpacity = (Math.random()*0.35 + 0.2).toFixed(2);

    dot.style.top = top + '%';
    dot.style.left = left + '%';
    dot.style.width = size + 'px';
    dot.style.height = size + 'px';
    dot.style.setProperty('--dx', dx);
    dot.style.setProperty('--dy', dy);
    dot.style.setProperty('--max-op', maxOpacity);
    dot.style.animation = `twinkle ${blinkDur} ease-in-out ${delay} infinite, drift ${driftDur} ease-in-out ${delay} infinite alternate`;
    field.appendChild(dot);
  }
}

(function init(){
  const snap = getSnapshotFromHash();
  if(snap){
    enterSnapshotMode(snap);
  } else {
    loadSubject('maths');
    loadSubject('reasoning');
    renderAll();
    initName();
  }
  initParticles();

  document.querySelectorAll('.tab').forEach(t => addTilt(t, 8));
  addTilt(document.getElementById('resetBtn'), 6);
})();
</script>
</body>
</html>
